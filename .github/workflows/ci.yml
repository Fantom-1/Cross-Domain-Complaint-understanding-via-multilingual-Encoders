name: CI Verification

on:
  push:
    branches: [ main, DATA_PREPARATION, phase3-profiling, feature/phase3-profiling, phase4-tokenization, feature/phase4-tokenization, phase5-deduplication, feature/phase5-deduplication, phase6-taxonomy, feature/phase6-taxonomy, phase7-splits, feature/phase7-splits ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow pyyaml requests

      - name: Run Phase 1 Provenance Tests
        run: |
          python -m unittest tests/data/test_phase1_provenance.py

      - name: Run Phase 1 Audit
        run: |
          python scripts/audit_phase1.py

      - name: Run Phase 2 Parsing Tests
        run: |
          python -m unittest tests/data/test_phase2_parsing.py

      - name: Run Phase 2 Audit
        run: |
          python scripts/audit_phase2.py

      - name: Run Phase 3 Profiling Tests
        run: |
          python -m unittest tests/data/test_phase3_profiling.py

      - name: Run Phase 3 Audit
        run: |
          python scripts/audit_phase3.py

      - name: Run Phase 4 Tokenization Tests
        run: |
          python -m unittest tests/data/test_phase4_tokenization.py

      - name: Run Phase 4 Audit
        run: |
          python scripts/audit_phase4.py

      - name: Run Phase 5 Deduplication Tests
        run: |
          python -m unittest tests/data/test_phase5_deduplication.py

      - name: Run Phase 5 Audit
        run: |
          python scripts/audit_phase5.py

      - name: Run Phase 6 Taxonomy Tests
        run: |
          python -m unittest tests/data/test_phase6_taxonomy.py

      - name: Run Phase 6 Audit
        run: |
          python scripts/audit_phase6.py

      - name: Run Phase 7 Splits Tests
        run: |
          python -m unittest tests/data/test_phase7_splits.py

      - name: Run Phase 7 Audit
        run: |
          python scripts/audit_phase7.py
